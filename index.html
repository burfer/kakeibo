<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>支出の4象限</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F5F6F3; --paper:#FFFFFF; --ink:#1E2430; --mute:#6B7280; --line:#DCDFD9;
  --rf:#2F5D8A; --rv:#3C8A6E; --if:#9A6A2A; --iv:#8A3C5C; --x:#9AA0A6;
  --up:#B3261E; --down:#2E7D5B; --tint:#EEF0EA;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#151920; --paper:#1E232C; --ink:#E7EAEF; --mute:#9AA3B2; --line:#2F3641;
  --rf:#7FB0E0; --rv:#7FCBAA; --if:#D9A864; --iv:#D98AAA; --x:#7A818B;
  --up:#F28B82; --down:#7FCBAA; --tint:#262C36;
}}
:root[data-theme="dark"]{
  --bg:#151920; --paper:#1E232C; --ink:#E7EAEF; --mute:#9AA3B2; --line:#2F3641;
  --rf:#7FB0E0; --rv:#7FCBAA; --if:#D9A864; --iv:#D98AAA; --x:#7A818B;
  --up:#F28B82; --down:#7FCBAA; --tint:#262C36;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
main{max-width:640px;margin:0 auto;padding:12px 16px calc(72px + env(safe-area-inset-bottom,0px))}
h1{font-size:20px;font-weight:700;margin:4px 0 2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding:4px 0 6px;margin:0 -16px;padding-left:16px;padding-right:16px}
.top h1{margin:0 0 6px}
.top .months{margin:0}
.panel>section:first-child{margin-top:12px}
.notice{margin-top:12px;background:var(--tint);border-radius:6px;padding:10px 12px;font-size:13px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.notice b{color:var(--up)}
.bigempty{text-align:center;padding:48px 12px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);display:flex;padding:0 0 env(safe-area-inset-bottom,0px);z-index:10}
.tabs button{flex:1;background:none;border:0;padding:12px 0 10px;font-size:13px;color:var(--mute);cursor:pointer;border-top:2px solid transparent;margin-top:-1px}
.tabs button[aria-current=page]{color:var(--ink);font-weight:700;border-top-color:var(--ink)}
.tabs button:focus-visible{outline:2px solid var(--rf);outline-offset:-2px}
section{margin-top:28px}
h2{font-size:15px;font-weight:700;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline}
h2 small{font-weight:400;color:var(--mute);font-size:12px}
button,select,label.btn{font:inherit;color:inherit}
.btn{display:inline-block;background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:focus-visible,select:focus-visible,.chip:focus-visible,.quad:focus-visible{outline:2px solid var(--rf);outline-offset:2px}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.status{font-size:13px;color:var(--mute);margin-top:8px;min-height:1.2em}
.status.err{color:var(--up)}
.months{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:auto 1fr 1fr;grid-template-rows:auto 1fr 1fr;gap:6px}
.axis{color:var(--mute);font-size:12px;display:flex;align-items:center;justify-content:center}
.axis.v{writing-mode:vertical-rl}
.quad{background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:6px;padding:10px 10px 8px;text-align:left;cursor:pointer;min-height:96px;display:flex;flex-direction:column;justify-content:space-between}
.quad .name{font-size:12px;color:var(--mute)}
.quad .amt{font-size:22px;font-weight:700;letter-spacing:-.01em;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums}
.quad .amt small{font-size:12px;font-weight:400;margin-left:2px}
.quad .diff{font-size:12px;margin-top:6px;color:var(--mute);font-variant-numeric:tabular-nums}
.diff.up{color:var(--up)} .diff.down{color:var(--down)}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;padding:10px 4px;border-top:1px solid var(--line)}
.total b{font-size:18px;font-variant-numeric:tabular-nums}
.detail{background:var(--paper);border:1px solid var(--line);border-radius:6px;margin-top:8px;overflow:hidden}
.detail .head{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;font-weight:700}
.row{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:14px}
.row:last-child{border-bottom:0}
.row .k{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .k span{color:var(--mute)}
.row .v{font-variant-numeric:tabular-nums;white-space:nowrap}
.row .d{font-size:12px;color:var(--mute);margin-left:6px}
.unmapped{background:var(--paper);border:1px solid var(--line);border-radius:6px}
.maprow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.maprow:last-child{border-bottom:0}
.maprow .k{font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.maprow .k span{color:var(--mute)}
.maprow .n{font-size:12px;color:var(--mute);display:block}
select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 8px;font-size:14px;max-width:140px}
select.q-RF{border-color:var(--rf)} select.q-RV{border-color:var(--rv)} select.q-IF{border-color:var(--if)} select.q-IV{border-color:var(--iv)}
.empty{color:var(--mute);font-size:14px;padding:14px 12px}
.chart{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:10px 8px 4px;overflow-x:auto}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mute);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.trend{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px;font-variant-numeric:tabular-nums}
.trend th,.trend td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.trend th:first-child,.trend td:first-child{text-align:left}
.trend thead th{color:var(--mute);font-weight:400}
.wrap{overflow-x:auto}
details summary{cursor:pointer;color:var(--mute);font-size:13px}
#trendpick{margin:0 0 8px}
#trendpick select{max-width:100%;width:100%}
.months{margin-bottom:8px}
h3{font-size:14px;font-weight:700;margin:16px 0 6px;display:flex;justify-content:space-between;align-items:baseline}
h3 small{font-weight:400;color:var(--mute);font-size:12px}
.bsum{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.bsum .card{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:10px}
.bsum .card .name{font-size:12px;color:var(--mute)}
.bsum .card .amt{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.bsum .card .diff{font-size:12px;font-variant-numeric:tabular-nums;margin-top:2px}
.brow{padding:8px 12px;border-bottom:1px solid var(--line)}
.brow:last-child{border-bottom:0}
.brow .top{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.brow .k{font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .k span{color:var(--mute)}
.brow .sub{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums;margin-top:2px}
.brow input{width:110px;font:inherit;font-size:14px;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 8px;text-align:right;font-variant-numeric:tabular-nums}
.brow input:focus-visible{outline:2px solid var(--rf);outline-offset:1px}
.bar{height:6px;background:var(--tint);border-radius:3px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--down);border-radius:3px}
.brow.over .bar i{background:var(--up)}
.brow.over .k{color:var(--up)}
.pct{font-size:12px;font-variant-numeric:tabular-nums;margin-left:6px}
.over .pct{color:var(--up);font-weight:700}
.hint{font-size:13px;color:var(--mute);margin:6px 0 0}
@media (prefers-reduced-motion:no-preference){.quad{transition:transform .12s}.quad:active{transform:scale(.985)}}
</style>
</head>
<body>
<main>
  <header class="top">
    <h1>支出の4象限</h1>
    <div class="months" id="months"></div>
  </header>

  <div class="panel" data-tab="now">
    <div class="notice" id="notice" hidden></div>
    <section id="quadsec" hidden>
      <h2>4象限 <small id="monthmeta"></small></h2>
      <div class="grid" id="grid"></div>
      <div class="total"><span>合計</span><b id="total"></b></div>
      <div id="detail"></div>
    </section>
    <div class="empty bigempty" id="noworry" hidden>まだデータがありません。「設定」からCSVを取り込んでください。</div>
  </div>

  <div class="panel" data-tab="budget" hidden>
    <section id="budgetsec" hidden>
      <h2>予算と実績 <small id="budgetmeta"></small></h2>
      <div class="bsum" id="bsum"></div>
      <h3>定期の科目 <small>今月の実績 vs 月予算</small></h3>
      <div class="unmapped" id="bfixed"></div>
      <h3>不定期の科目 <small>今年の累計 vs 年予算</small></h3>
      <div class="unmapped" id="bvar"></div>
      <p class="hint">定期の科目は月額、不定期の科目は年額で入力します。未入力の科目は下に並びます。</p>
    </section>
  </div>

  <div class="panel" data-tab="trend" hidden>
    <section id="trendsec" hidden>
      <h2>月ごとの推移</h2>
      <div class="months" id="trendmode"></div>
      <div id="trendpick"></div>
      <div class="chart" id="chart"></div>
      <div class="wrap"><table class="trend" id="trendtable"></table></div>
    </section>
  </div>

  <div class="panel" data-tab="settings" hidden>
    <section id="import">
      <h2>CSVの取り込み</h2>
      <label class="btn" for="file">CSVを取り込む</label>
      <input id="file" type="file" accept=".csv,text/csv" multiple>
      <div class="status" id="status"></div>
      <p class="hint">マネーフォワードの「収入・支出詳細」CSVに対応。同じ明細を再取り込みしても二重計上されません。「振替」「収入」「計算対象外」の行は除外します。</p>
    </section>
    <section id="unmappedsec" hidden>
      <h2>未分類の科目 <small>象限を選ぶと対応表に追加されます</small></h2>
      <div class="unmapped" id="unmapped"></div>
    </section>
    <section id="mapsec" hidden>
      <h2>対応表 <small id="mapmeta"></small></h2>
      <div class="unmapped" id="mapall"></div>
    </section>
  </div>

  <nav class="tabs" aria-label="画面切り替え">
    <button data-tab="now" aria-current="page">今月</button>
    <button data-tab="budget">予算</button>
    <button data-tab="trend">推移</button>
    <button data-tab="settings">設定</button>
  </nav>
</main>

<script>
(function(){
"use strict";
const Q = {
  RF:{name:"定期定額",   color:"var(--rf)"},
  RV:{name:"定期非定額", color:"var(--rv)"},
  IF:{name:"不定期定額", color:"var(--if)"},
  IV:{name:"不定期非定額",color:"var(--iv)"},
  X: {name:"集計対象外", color:"var(--x)"}
};
const ORDER = ["RF","RV","IF","IV"];
const $ = s => document.querySelector(s);
const yen = n => "¥" + Math.round(n).toLocaleString("ja-JP");
const key = (c,s) => c + "｜" + s;
const safeId = m => m.replace("/","-");

let db = null;
let mapping = {};              // key -> RF|RV|IF|IV|X
let months = {};               // "YYYY-MM" -> {rows:[...]}
let budgets = {};              // key -> number (定期: 月額, 不定期: 年額)
let current = null;
let openQuad = null;
let tab = "now";
let trendMode = "ALL";   // ALL | RF|RV|IF|IV | KEY
let trendKey = null;
const LS = "kakeibo4q";

function setStatus(t, err){ const e=$("#status"); e.textContent=t; e.classList.toggle("err",!!err); }

/* ---------- storage ---------- */
function loadLocal(){
  try{ const j=JSON.parse(localStorage.getItem(LS)||"null"); if(j){ mapping=j.mapping||{}; months=j.months||{}; budgets=j.budgets||{}; } }catch(e){}
}
function saveLocal(){
  try{ localStorage.setItem(LS, JSON.stringify({mapping,months,budgets})); }catch(e){}
}
async function loadDb(){
  if(!db) return;
  const m = await db.doc("data/mapping").get();
  if(m.exists) mapping = m.data().items || {};
  const b = await db.doc("data/budgets").get();
  if(b.exists) budgets = b.data().items || {};
  const snap = await db.collection("months").get();
  snap.docs.forEach(d => { const b=d.data(); if(b && b.rows) months[b.month] = {rows:b.rows}; });
}
async function persistMapping(){
  saveLocal();
  if(db){ try{ await db.doc("data/mapping").set({items:mapping, updatedAt:new Date().toISOString()}); }
          catch(e){ setStatus("対応表の保存に失敗しました（端末内には保存済み）", true); } }
}
async function persistBudgets(){
  saveLocal();
  if(db){ try{ await db.doc("data/budgets").set({items:budgets, updatedAt:new Date().toISOString()}); }
          catch(e){ setStatus("予算の保存に失敗しました（端末内には保存済み）", true); } }
}
async function persistMonth(m){
  saveLocal();
  if(db){ try{ await db.collection("months").doc(safeId(m)).set({month:m, rows:months[m].rows, updatedAt:new Date().toISOString()}); }
          catch(e){ setStatus(m+" の保存に失敗しました（端末内には保存済み）", true); } }
}

/* ---------- CSV ---------- */
function decode(buf){
  try{ return new TextDecoder("utf-8",{fatal:true}).decode(buf).replace(/^\uFEFF/,""); }
  catch(e){ return new TextDecoder("shift_jis").decode(buf); }
}
function parseCSV(text){
  const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=""; }
    else if(c==='\n'){ row.push(f); rows.push(row); row=[]; f=""; }
    else if(c!=='\r') f+=c;
  }
  if(f!==""||row.length){ row.push(f); rows.push(row); }
  return rows;
}
function importRows(table){
  const head = table[0]; const idx = n => head.findIndex(h => h.replace(/\s/g,"").startsWith(n));
  const I = {calc:idx("計算対象"), date:idx("日付"), name:idx("内容"), amt:idx("金額"), cat:idx("大項目"), sub:idx("中項目"), tr:idx("振替"), id:idx("ID")};
  if(I.date<0||I.amt<0||I.cat<0) throw new Error("マネーフォワードの形式ではないようです（日付・金額・大項目の列が見つかりません）");
  const touched = new Set(); let added=0, skipped=0;
  for(const r of table.slice(1)){
    if(r.length<3) continue;
    const amt = Number(String(r[I.amt]).replace(/[,"]/g,""));
    if(!(amt<0)) { skipped++; continue; }
    if(I.calc>=0 && r[I.calc]!=="1") { skipped++; continue; }
    if(I.tr>=0 && r[I.tr]==="1") { skipped++; continue; }
    const d = r[I.date]; const m = d.slice(0,7).replace("/","-");
    if(!/^\d{4}-\d{2}$/.test(m)) continue;
    const id = I.id>=0 && r[I.id] ? r[I.id] : d+"|"+r[I.name]+"|"+amt;
    months[m] = months[m] || {rows:[]};
    const list = months[m].rows;
    const k = list.findIndex(x => x.id===id);
    const row = {id, d, name:r[I.name]||"", amt:-amt, cat:r[I.cat]||"", sub:(I.sub>=0?r[I.sub]:"")||""};
    if(k>=0) list[k]=row; else { list.push(row); added++; }
    touched.add(m);
  }
  return {touched, added, skipped};
}
$("#file").addEventListener("change", async ev => {
  const files=[...ev.target.files]; if(!files.length) return;
  setStatus("取り込み中…");
  try{
    let added=0; const touched=new Set();
    for(const f of files){
      const res = importRows(parseCSV(decode(await f.arrayBuffer())));
      added+=res.added; res.touched.forEach(m=>touched.add(m));
    }
    for(const m of touched) await persistMonth(m);
    const ms=[...touched].sort();
    current = ms[ms.length-1] || current;
    setStatus(`${added}件を追加しました（${ms.length}か月分）`);
    render();
  }catch(e){ setStatus(e.message||"取り込みに失敗しました", true); }
  ev.target.value="";
});

/* ---------- aggregation ---------- */
function agg(m){
  const out={RF:0,RV:0,IF:0,IV:0,X:0,total:0}; const by={RF:{},RV:{},IF:{},IV:{},X:{}}; const un={};
  for(const r of (months[m]?months[m].rows:[])){
    const k=key(r.cat,r.sub); const q=mapping[k];
    if(!q){ un[k]=(un[k]||0)+r.amt; continue; }
    out[q]+=r.amt; by[q][k]=(by[q][k]||0)+r.amt;
    if(q!=="X") out.total+=r.amt;
  }
  return {out,by,un};
}
function prevMonth(m){ const ms=Object.keys(months).sort(); const i=ms.indexOf(m); return i>0?ms[i-1]:null; }
function diffHtml(cur, prev){
  if(prev==null) return `<div class="diff">先月データなし</div>`;
  const d=cur-prev; const cls=d>0?"up":d<0?"down":"";
  return `<div class="diff ${cls}">先月比 ${d>0?"+":""}${yen(d)}</div>`;
}

/* ---------- tabs ---------- */
function showTab(t){
  tab=t;
  document.querySelectorAll(".panel").forEach(p=>p.hidden=p.dataset.tab!==t);
  document.querySelectorAll(".tabs button").forEach(b=>{ if(b.dataset.tab===t) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  $("#months").style.display = (t==="now"||t==="budget") ? "" : "none";
  window.scrollTo(0,0);
}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>showTab(b.dataset.tab));

/* ---------- render ---------- */
function render(){
  const ms=Object.keys(months).sort();
  const has=ms.length>0;
  ["#quadsec","#budgetsec","#unmappedsec","#trendsec","#mapsec"].forEach(s=>$(s).hidden=!has);
  $("#noworry").hidden=has; $("#notice").hidden=true;
  showTab(tab);
  if(!has){ return; }
  if(!current||!months[current]) current=ms[ms.length-1];

  $("#months").innerHTML = ms.map(m=>`<button class="chip" aria-pressed="${m===current}" data-m="${m}">${m.replace("-","/")}</button>`).join("");
  $("#months").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{current=b.dataset.m;openQuad=null;render();});
  $("#monthmeta").textContent = `${months[current].rows.length}件`;

  const a=agg(current), pm=prevMonth(current), pa=pm?agg(pm):null;
  const cell = q => `<button class="quad" style="--c:${Q[q].color}" data-q="${q}" aria-expanded="${openQuad===q}">
      <div class="name">${Q[q].name}</div>
      <div><div class="amt">${yen(a.out[q])}</div>${diffHtml(a.out[q], pa?pa.out[q]:null)}</div></button>`;
  $("#grid").innerHTML = `<div></div><div class="axis">定額</div><div class="axis">非定額</div>
     <div class="axis v">定期</div>${cell("RF")}${cell("RV")}
     <div class="axis v">不定期</div>${cell("IF")}${cell("IV")}`;
  $("#grid").querySelectorAll(".quad").forEach(b=>b.onclick=()=>{openQuad=openQuad===b.dataset.q?null:b.dataset.q;render();});
  const unTotal=Object.values(a.un).reduce((s,v)=>s+v,0);
  $("#total").textContent = yen(a.out.total) + (unTotal?`（未分類 ${yen(unTotal)} は含まず）`:"");

  const det=$("#detail");
  if(openQuad){
    const items=Object.entries(a.by[openQuad]).sort((x,y)=>y[1]-x[1]);
    det.innerHTML = `<div class="detail"><div class="head"><span>${Q[openQuad].name}の内訳</span><span>${yen(a.out[openQuad])}</span></div>` +
      (items.length? items.map(([k,v])=>{ const [c,s]=k.split("｜"); const pv=pa?(pa.by[openQuad][k]||0):null;
        const d=pv==null?"":` <span class="d">${(v-pv)>0?"+":""}${yen(v-pv)}</span>`;
        return `<div class="row"><span class="k">${c}<span> ＞ ${s}</span></span><span class="v">${yen(v)}${d}</span></div>`; }).join("")
      : `<div class="empty">この月の該当支出はありません</div>`) + `</div>`;
  } else det.innerHTML="";

  const unKeys=Object.entries(a.un).sort((x,y)=>y[1]-x[1]);
  $("#unmappedsec").hidden = unKeys.length===0;
  if(unKeys.length){ const n=$("#notice"); n.hidden=false;
    n.innerHTML=`<span>未分類の科目が <b>${unKeys.length}件</b>（${yen(unTotal)}）あります</span><span>振り分ける ›</span>`;
    n.onclick=()=>{ showTab("settings"); $("#unmappedsec").scrollIntoView({block:"start"}); }; }
  $("#unmapped").innerHTML = unKeys.map(([k,v])=>mapRow(k, `${yen(v)}・この月`)).join("");
  bindSelects($("#unmapped"));

  renderBudget(ms, a);
  renderTrend(ms);
  renderMapAll();
}
function mapRow(k, note){
  const [c,s]=k.split("｜"); const q=mapping[k]||"";
  return `<div class="maprow"><span class="k">${c}<span> ＞ ${s}</span><span class="n">${note}</span></span>
    <select data-k="${k}" class="q-${q}"><option value="">選ぶ</option>${Object.keys(Q).map(x=>`<option value="${x}" ${x===q?"selected":""}>${Q[x].name}</option>`).join("")}</select></div>`;
}
function bindSelects(root){
  root.querySelectorAll("select").forEach(sel=>sel.onchange=async ()=>{
    const k=sel.dataset.k; if(sel.value) mapping[k]=sel.value; else delete mapping[k];
    await persistMapping(); render();
  });
}
function renderMapAll(){
  const keys=new Set(Object.keys(mapping));
  Object.values(months).forEach(m=>m.rows.forEach(r=>keys.add(key(r.cat,r.sub))));
  const list=[...keys].sort((a,b)=>a.localeCompare(b,"ja"));
  $("#mapmeta").textContent=`${Object.keys(mapping).length} / ${list.length} 科目を振り分け済み`;
  $("#mapall").innerHTML = list.map(k=>mapRow(k, mapping[k]?"":"未分類")).join("");
  bindSelects($("#mapall"));
}
function renderBudget(ms, a){
  const year=current.slice(0,4);
  const ytd=ms.filter(m=>m.startsWith(year)&&m<=current);
  const nMonths=ytd.length;
  const yAgg=ytd.map(m=>agg(m));
  const sumBy=(q,k)=>yAgg.reduce((s,x)=>s+(x.by[q][k]||0),0);
  $("#budgetmeta").textContent=`${year}年 1〜${Number(current.slice(5))}月`;

  const rows={fixed:[],var:[]};
  Object.keys(mapping).forEach(k=>{
    const q=mapping[k]; if(q==="X") return;
    const b=budgets[k];
    const fixed=(q==="RF"||q==="RV");
    const actual=fixed?(a.by[q][k]||0):sumBy(q,k);
    rows[fixed?"fixed":"var"].push({k,q,b,actual,ratio:b?actual/b:null});
  });
  const sortRows=r=>r.sort((x,y)=>{ if(x.b&&!y.b) return -1; if(!x.b&&y.b) return 1; if(x.b&&y.b) return y.ratio-x.ratio; return y.actual-x.actual; });
  const rowHtml=r=>{ const [c,sub]=r.k.split("｜"); const fixed=(r.q==="RF"||r.q==="RV");
    const over=r.b&&r.actual>r.b; const pct=r.b?Math.round(r.actual/r.b*100):null;
    const alt=r.b?(fixed?`年 ${yen(r.b*12)}`:`月平均 ${yen(r.b/12)}`):"";
    const diff=r.b?`${over?"超過":"残り"} ${yen(Math.abs(r.b-r.actual))}`:"予算未設定";
    return `<div class="brow ${over?"over":""}"><div class="top">
      <div><div class="k">${c}<span> ＞ ${sub}</span>${pct!=null?`<span class="pct">${pct}%</span>`:""}</div>
      <div class="sub">実績 ${yen(r.actual)}${r.b?` / 予算 ${yen(r.b)}`:""}・${diff}${alt?`・${alt}`:""}</div></div>
      <input type="number" inputmode="numeric" min="0" step="100" placeholder="${fixed?"月額":"年額"}" value="${r.b||""}" data-k="${r.k}" aria-label="${c} ${sub} の${fixed?"月":"年"}予算"></div>
      ${r.b?`<div class="bar"><i style="width:${Math.min(100,pct)}%"></i></div>`:""}</div>`; };
  $("#bfixed").innerHTML = rows.fixed.length? sortRows(rows.fixed).map(rowHtml).join("") : `<div class="empty">定期に振り分けた科目がまだありません</div>`;
  $("#bvar").innerHTML = rows.var.length? sortRows(rows.var).map(rowHtml).join("") : `<div class="empty">不定期に振り分けた科目がまだありません</div>`;
  $("#budgetsec").querySelectorAll("input").forEach(inp=>inp.onchange=async ()=>{
    const v=Number(inp.value); if(v>0) budgets[inp.dataset.k]=v; else delete budgets[inp.dataset.k];
    await persistBudgets(); render();
  });

  const bf=rows.fixed.filter(r=>r.b), bv=rows.var.filter(r=>r.b);
  const fB=bf.reduce((s,r)=>s+r.b,0), fA=bf.reduce((s,r)=>s+r.actual,0);
  const vB=bv.reduce((s,r)=>s+r.b,0), vA=bv.reduce((s,r)=>s+r.actual,0);
  const yB=fB*12+vB;
  const yA=yAgg.reduce((s,x)=>s+ bf.reduce((t,r)=>t+(x.by[r.q][r.k]||0),0),0)+vA;
  const card=(name,A,B,note)=>{ const d=B-A; return `<div class="card"><div class="name">${name}</div><div class="amt">${yen(A)}</div>
     <div class="diff ${d<0?"up":"down"}">予算 ${yen(B)}・${d<0?"超過":"残り"} ${yen(Math.abs(d))}</div>${note?`<div class="diff" style="color:var(--mute)">${note}</div>`:""}</div>`; };
  $("#bsum").innerHTML = card("定期・今月",fA,fB,`予算設定 ${bf.length}/${rows.fixed.length}科目`)
    + card("不定期・今年累計",vA,vB,`予算設定 ${bv.length}/${rows.var.length}科目`)
    + card("年間合計（予算設定済み科目）",yA,yB,`月平均予算 ${yen(yB/12)}・${nMonths}か月分の実績`);
}
function renderTrend(ms){
  const modes=[["ALL","4象限"],...ORDER.map(q=>[q,Q[q].name]),["KEY","科目"]];
  $("#trendmode").innerHTML = modes.map(([v,t])=>`<button class="chip" aria-pressed="${trendMode===v}" data-v="${v}">${t}</button>`).join("");
  $("#trendmode").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{trendMode=b.dataset.v;renderTrend(Object.keys(months).sort());});

  const aggs=ms.map(m=>({m,a:agg(m)}));
  const pick=$("#trendpick");
  let series=[], cols=[], label="";
  if(trendMode==="ALL"){
    pick.innerHTML="";
    cols=ORDER.map(q=>({name:Q[q].name,color:Q[q].color}));
    series=aggs.map(x=>ORDER.map(q=>x.a.out[q]));
  } else if(trendMode==="KEY"){
    const keys=new Set(Object.keys(mapping));
    Object.values(months).forEach(m=>m.rows.forEach(r=>keys.add(key(r.cat,r.sub))));
    const list=[...keys].sort((a,b)=>a.localeCompare(b,"ja"));
    if(!trendKey||!keys.has(trendKey)) trendKey=list[0]||null;
    pick.innerHTML=`<select id="keysel">${list.map(k=>`<option value="${k}" ${k===trendKey?"selected":""}>${k.replace("｜"," ＞ ")}</option>`).join("")}</select>`;
    $("#keysel").onchange=e=>{trendKey=e.target.value;renderTrend(ms);};
    const q=mapping[trendKey]||"X";
    cols=[{name:trendKey?trendKey.replace("｜"," ＞ "):"",color:Q[q].color}];
    series=aggs.map(x=>[ (x.a.by[q][trendKey]||0) + (x.a.un[trendKey]||0) ]);
  } else {
    pick.innerHTML="";
    const q=trendMode;
    const keyset=new Set(); aggs.forEach(x=>Object.keys(x.a.by[q]).forEach(k=>keyset.add(k)));
    const tot={}; keyset.forEach(k=>tot[k]=aggs.reduce((s,x)=>s+(x.a.by[q][k]||0),0));
    const keys=[...keyset].sort((a,b)=>tot[b]-tot[a]);
    const shades=[1,.8,.62,.46,.32,.22];
    cols=keys.map((k,i)=>({name:k.replace("｜"," ＞ "),color:`color-mix(in srgb, ${Q[q].color} ${Math.round(shades[Math.min(i,5)]*100)}%, var(--paper))`}));
    series=aggs.map(x=>keys.map(k=>x.a.by[q][k]||0));
  }
  const totals=series.map(s=>s.reduce((a,b)=>a+b,0));
  const max=Math.max(1,...totals);
  const W=Math.max(300, ms.length*44+40), H=180, pad={l:8,r:8,t:12,b:22}, bw=28, ch=H-pad.t-pad.b;
  let svg=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="月ごとの推移">`;
  aggs.forEach((d,i)=>{
    const x=pad.l+i*44+8; let y=H-pad.b;
    series[i].forEach((v,j)=>{ const h=v/max*ch; if(h>0){ y-=h; svg+=`<rect x="${x}" y="${y}" width="${bw}" height="${h}" fill="${cols[j].color}" />`; } });
    svg+=`<text x="${x+bw/2}" y="${H-6}" font-size="10" text-anchor="middle" fill="var(--mute)">${d.m.slice(5)}月</text>`;
    svg+=`<text x="${x+bw/2}" y="${y-3}" font-size="9" text-anchor="middle" fill="var(--mute)">${Math.round(totals[i]/1000)}k</text>`;
  });
  svg+=`</svg>`;
  const legendCols = cols.length>6 ? cols.slice(0,6) : cols;
  $("#chart").innerHTML = svg + `<div class="legend">${legendCols.map(c=>`<span><i style="background:${c.color}"></i>${c.name}</span>`).join("")}${cols.length>6?`<span>他${cols.length-6}科目</span>`:""}</div>`;
  const tcols = trendMode==="ALL" ? cols : cols.slice(0,8);
  $("#trendtable").innerHTML = `<thead><tr><th>月</th>${tcols.map(c=>`<th>${c.name}</th>`).join("")}${tcols.length>1?"<th>合計</th>":""}</tr></thead><tbody>` +
    aggs.map((d,i)=>`<tr><td>${d.m.replace("-","/")}</td>${tcols.map((c,j)=>`<td>${yen(series[i][j])}</td>`).join("")}${tcols.length>1?`<td><b>${yen(totals[i])}</b></td>`:""}</tr>`).join("") + `</tbody>`;
}

/* ---------- boot ---------- */
loadLocal(); if(!Object.keys(months).length) tab="settings"; render();
(async ()=>{
  try{ db = await (window.claude && window.claude.use ? window.claude.use("db") : Promise.resolve(null)); }catch(e){ db=null; }
  if(db){
    try{ await loadDb(); saveLocal(); setStatus(Object.keys(months).length?"アカウントに保存されたデータを読み込みました":"まだデータがありません。CSVを取り込んでください"); }
    catch(e){ setStatus("保存データの読み込みに失敗しました（端末内のデータを表示）", true); }
  } else {
    setStatus(Object.keys(months).length?"端末内のデータを表示しています":"CSVを取り込んでください");
  }
  render();
})();
})();
</script>
